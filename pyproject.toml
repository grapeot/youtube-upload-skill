[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-upload-skill"
version = "0.1.0"
description = "Agent skill + CLI: upload a local video to your own YouTube channel through the official YouTube Data API v3, private by default, with a dry-run plan and a readback."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yt-upload = "youtube_upload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
